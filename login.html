<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — SAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EFE4;
    --bg-raised:#EAE3D3;
    --forest:#2E362A;
    --sage:#5C6E4F;
    --sage-dim:#7C8B6C;
    --terracotta:#C17A54;
    --ink:#2E362A;
    --muted:rgba(46,54,42,0.62);
    --border:rgba(46,54,42,0.16);
    --error:#B3452F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:40px 20px}

  .card{
    width:100%;max-width:400px;background:#FBFAF6;border:1px solid var(--border);
    border-radius:16px;padding:36px 34px 30px;
  }
  .logo-row{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:22px}
 .logo-row{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:22px}
 .logo-mark-img{
  width:30px;height:30px;border-radius:7px;
  background:var(--sand);
  padding:2px;
  object-fit:contain;
  display:block;
  margin:0;
}
  .logo-row span{font-family:'Fraunces',serif;font-weight:600;font-size:18px}

  h1{
    font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px;
    text-align:center;color:var(--forest);
  }
  .sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 26px}

  label{display:block;font-size:13px;font-weight:600;color:var(--forest);margin-bottom:6px}
  .field{margin-bottom:16px}
  input{
    width:100%;padding:11px 13px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--ink);font-family:'Karla',sans-serif;font-size:14px;outline:none;
  }
  input:focus{border-color:var(--sage-dim)}
  .row-between{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px}
  .row-between a{font-size:12.5px;color:var(--sage);text-decoration:none}
  .row-between a:hover{color:var(--forest)}

  .btn-submit{
    width:100%;padding:12px;border:none;border-radius:9px;background:var(--forest);
    color:var(--bg);font-weight:600;font-size:14.5px;cursor:pointer;font-family:'Karla',sans-serif;
  }
  .btn-submit:hover{background:#232920}
  .btn-submit:disabled{background:var(--bg-raised);color:var(--muted);cursor:default}

  .error-msg{
    display:none;background:rgba(179,69,47,0.08);border:1px solid rgba(179,69,47,0.25);
    color:var(--error);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:16px;
  }

  .foot-link{text-align:center;font-size:13px;color:var(--muted);margin-top:22px}
  .foot-link a{color:var(--sage);text-decoration:none;font-weight:600}
  .foot-link a:hover{color:var(--forest)}
</style>
</head>
<body>

<div class="card">
  <div class="logo-row"><img src="logo-sage.png" alt="SAGE" class="logo-mark-img"><span>SAGE</span></div>
  <h1>Masuk ke akun Anda</h1>
  <p class="sub">Asisten konselor untuk asesmen dan tindak lanjut sesi.</p>

  <div class="error-msg" id="errorMsg">Email atau kata sandi tidak sesuai.</div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@birokonseling.com" required>
    </div>
    <div class="field">
      <label for="password">Kata Sandi</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <div class="row-between">
      <span></span>
      <a href="#">Lupa kata sandi?</a>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Masuk</button>
  </form>

  <div class="foot-link">Belum punya akun? <a href="landing.html">Coba Gratis</a></div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Memproses...';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const user = await loginToBackend(email, password);
      // Simpan data user (misal di sessionStorage) untuk dipakai di chat.html
      sessionStorage.setItem('sageUser', JSON.stringify(user));
      window.location.href = 'chat.html';
    } catch (err) {
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Masuk';
    }
  });

  // ---- Ganti fungsi ini dengan pemanggilan API login/auth Anda yang sebenarnya ----
  async function loginToBackend(email, password) {
    // Contoh implementasi nyata:
    // const res = await fetch('https://api.birokonseling.com/auth/login', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify({ email, password })
    // });
    // if (!res.ok) throw new Error('Login gagal');
    // return await res.json(); // { nama, role, token, ... }

    await new Promise(r => setTimeout(r, 700)); // simulasi latensi
    if (!email || !password) throw new Error('Data kosong');
    return { nama: 'Konselor', role: 'Biro Konseling' }; // data sementara
  }
</script>
</body>
</html>
