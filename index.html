<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Chat dengan SAGE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }
        #chatbox {
            border: 1px solid #ccc;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .user-msg {
            text-align: right;
            margin: 8px 0;
        }
        .sage-msg {
            text-align: left;
            margin: 8px 0;
            color: #2b6cb0;
        }
        #userInput {
            width: 75%;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <h2>Chat dengan SAGE</h2>
    <div id="chatbox"></div>
    <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Kirim</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatbox = document.getElementById('chatbox');
            chatbox.innerHTML += `<div class="user-msg"><b>Anda:</b> ${message}</div>`;
            input.value = '';
            chatbox.scrollTop = chatbox.scrollHeight;

            chatbox.innerHTML += `<div class="sage-msg" id="loading">SAGE sedang mengetik...</div>`;

            try {
                const response = await fetch('http://100.92.221.113:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();

                document.getElementById('loading').remove();
                chatbox.innerHTML += `<div class="sage-msg"><b>SAGE:</b> ${data.reply}</div>`;
                chatbox.scrollTop = chatbox.scrollHeight;
            } catch (error) {
                document.getElementById('loading').remove();
                chatbox.innerHTML += `<div class="sage-msg" style="color:red;">Error: tidak bisa terhubung ke server.</div>`;
            }
        }
    </script>
</body>
</html>
